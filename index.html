<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kartenflip</title>
  <style>
    :root { --w: 320px; --h: 440px; }
    body{
      margin:0; height:100vh; display:grid; place-items:center;
      background:#0b1020; font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:#fff; overflow:hidden;
    }
    .stage{
      width: var(--w); height: var(--h);
      perspective: 1000px;
    }

    /* Karte */
    .card{
      position:relative;
      width:100%; height:100%;
      transform-style:preserve-3d;
      transition: transform 900ms cubic-bezier(.2,.8,.2,1);
      transform: rotateY(0deg);
      will-change: transform;
      cursor:pointer;
    }
    body[data-flipped="true"] .card{ transform: rotateY(180deg); }

    .face{
      position:absolute; inset:0;
      backface-visibility:hidden;
      border-radius: 14px;
      box-shadow: 0 28px 60px rgba(0,0,0,.45);
      overflow:hidden;
      display:flex; align-items:center; justify-content:center;
      border: 1px solid rgba(255,255,255,.12);
      background:#fff;
    }

    /* Rückseite: Bicycle-ähnlich (stilisiert, keine echten Markenassets) */
    .back{
      transform: rotateY(180deg);
      background:
        radial-gradient(circle at 50% 20%, rgba(255,255,255,.22), transparent 55%),
        radial-gradient(circle at 20% 30%, rgba(255,255,255,.12), transparent 45%),
        linear-gradient(135deg, #b3001b, #e0002a 55%, #b3001b);
    }
    .back::before{
      content:"";
      position:absolute; inset:0;
      background:
        repeating-linear-gradient(45deg, rgba(255,255,255,.10) 0 6px, rgba(255,255,255,0) 6px 14px);
      opacity:.35;
      mix-blend-mode: overlay;
    }
    .back .corner{
      position:absolute; font-weight:800; letter-spacing:.5px;
      color: rgba(255,255,255,.95);
      font-size: 22px;
      text-shadow: 0 2px 0 rgba(0,0,0,.15);
    }
    .back .corner.tl{ top:14px; left:16px; }
    .back .corner.br{ bottom:14px; right:16px; transform: rotate(180deg); }
    .back .bicycle{
      width: 82%;
      height: 82%;
      border-radius: 50%;
      border: 3px dashed rgba(255,255,255,.35);
      position:relative;
      display:grid; place-items:center;
      transform: rotate(-12deg);
      opacity:.85;
    }
    .back .bicycle .banner{
      position:absolute; inset:14%;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,.25);
    }
    .back .bicycle .center-pips{
      width: 26%;
      height: 26%;
      border-radius: 10px;
      background: rgba(255,255,255,.14);
      border: 1px solid rgba(255,255,255,.25);
      transform: rotate(18deg);
      display:grid; place-items:center;
      box-shadow: inset 0 0 0 2px rgba(0,0,0,.08);
    }
    .back .bicycle .center-pips span{
      font-size: 34px;
      line-height:1;
      filter: drop-shadow(0 4px 4px rgba(0,0,0,.2));
    }

    /* Vorderseite: Herz-Dame (stilisiert) */
    .front{
      background:
        radial-gradient(circle at 50% 0%, rgba(0,0,0,.06), transparent 60%),
        linear-gradient(180deg, #fff 0%, #f7f2f2 60%, #fff 100%);
    }

    .front .layout{
      position:relative;
      width:100%; height:100%;
      display:flex; flex-direction:column;
      padding: 18px 18px 22px;
    }
    .front .toprow{
      display:flex; align-items:flex-start; justify-content:space-between;
      color:#b0001c;
      font-weight:900;
      gap:10px;
    }
    .front .rank{
      font-size: 22px;
      line-height:1.05;
    }
    .front .pip{
      font-size: 22px;
      line-height:1;
    }

    .queen{
      flex:1;
      display:grid; place-items:center;
      position:relative;
    }

    /* Dame als CSS-“Illustration”: Krone + Herz-Symbol */
    .queen .crown{
      width: 120px; height: 68px;
      position:absolute; top: 34px;
      border: 2px solid rgba(176,0,28,.45);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(176,0,28,.08), rgba(176,0,28,.02));
      box-shadow: inset 0 0 0 2px rgba(176,0,28,.08);
    }
    .queen .crown::before,
    .queen .crown::after{
      content:"";
      position:absolute; top:-10px;
      width: 32px; height: 22px;
      background: rgba(176,0,28,.10);
      border: 2px solid rgba(176,0,28,.35);
      border-bottom:none;
      border-radius: 8px 8px 0 0;
    }
    .queen .crown::before{ left: 18px; transform: rotate(-8deg); }
    .queen .crown::after{ right: 18px; transform: rotate(8deg); }

    .queen .heart{
      font-size: 130px;
      color:#b0001c;
      filter: drop-shadow(0 10px 8px rgba(0,0,0,.08));
      margin-top: 55px;
    }

    .queen .q{
      position:absolute;
      bottom: 52px;
      font-size: 42px;
      font-weight:900;
      color:#b0001c;
      opacity:.95;
    }

    .front .bottomrow{
      display:flex; justify-content:space-between; align-items:flex-end;
      color:#b0001c; font-weight:900;
    }
    .front .bottomrow .rank{ font-size: 22px; }
    .front .bottomrow .pip{ font-size: 22px; }

    /* Kleines “Pop” beim Start */
    .stage[data-ready="false"] .card{
      transform: translateY(8px) rotateY(0deg);
    }

    .hint{
      margin-top: 16px;
      font-size: 14px;
      opacity: .7;
      text-align:center;
      user-select:none;
    }
  </style>
</head>
<body data-flipped="false">
  <div class="stage" data-ready="false" aria-label="Spielkarte">
    <div class="card" id="card" role="button" aria-label="Karte umdrehen" tabindex="0">
      <div class="face back">
        <div class="corner tl">A♥</div>
        <div class="corner br">A♥</div>
        <div class="bicycle" aria-hidden="true">
          <div class="banner"></div>
          <div class="center-pips"><span>♥</span></div>
        </div>
      </div>

      <div class="face front">
        <div class="layout">
          <div class="toprow">
            <div class="rank">Q</div>
            <div class="pip">♥</div>
          </div>

          <div class="queen">
            <div class="crown" aria-hidden="true"></div>
            <div class="heart" aria-hidden="true">♥</div>
            <div class="q">Q</div>
          </div>

          <div class="bottomrow">
            <div class="rank">Q</div>
            <div class="pip">♥</div>
          </div>
        </div>
      </div>
    </div>
    <div class="hint">Klicke zum Umdrehen</div>
  </div>

  <script>
    const body = document.body;
    const card = document.getElementById('card');
    const stage = document.querySelector('.stage');

    function setFlipped(v){
      body.dataset.flipped = v ? "true" : "false";
    }

    // Beim Öffnen umdrehen
    window.addEventListener('load', () => {
      stage.dataset.ready = "true";
      // kurzer Delay für den “Start”-Moment
      setTimeout(() => setFlipped(true), 250);
    });

    // Interaktiv: Klick/Enter kippt zurück
    function toggle(){
      const isFlipped = body.dataset.flipped === "true";
      setFlipped(!isFlipped);
    }
    card.addEventListener('click', toggle);
    card.addEventListener('keydown', (e) => {
      if(e.key === "Enter" || e.key === " "){
        e.preventDefault();
        toggle();
      }
    });
  </script>
</body>
</html>
